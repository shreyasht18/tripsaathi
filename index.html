<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belagavi TripSaathi</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="hero">
    <select id="langMini" aria-label="Language">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="mr">मराठी</option>
    </select>
    <div class="hero-in">
      <h1>Belagavi TripSaathi</h1>
      <p data-i18n="tagline"></p>
      <div class="wx" id="wx"></div>
      <div class="dots" id="dots" hidden><i id="d1"></i><i id="d2"></i><i id="d3"></i></div>
    </div>
    <svg class="skyline" viewBox="0 0 400 50" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 50V34h30v-6h6v6h20V26h6v8h30V30h8v-8h6v8h30V34h24l6-14 6 14h30v-8h8v8h40V30h6v-6h6v6h30v-8h6v8h40V36h30v14z"/>
    </svg>
  </header>

  <main>
    <!-- Step 0: language -->
    <section id="s0" class="screen card">
      <h2>Choose your language<br>भाषा चुनें · ಭಾಷೆ ಆರಿಸಿ · भाषा निवडा</h2>
      <div class="langgrid">
        <button class="langbtn" data-l="en">English</button>
        <button class="langbtn" data-l="hi">हिन्दी</button>
        <button class="langbtn" data-l="kn">ಕನ್ನಡ</button>
        <button class="langbtn" data-l="mr">मराठी</button>
      </div>
    </section>

    <!-- Step 1: where -->
    <section id="s1" class="screen card" hidden>
      <h2 data-i18n="whereTitle"></h2>
      <p class="sub" data-i18n="whereSub"></p>
      <button id="locBtn" class="btn alt" data-i18n="useLoc"></button>
      <p id="locStatus" class="status"></p>
      <label data-i18n="orPick"></label>
      <select id="startSel"></select>
      <button id="next1" class="btn" data-i18n="nextGroup"></button>
    </section>

    <!-- Step 2: group -->
    <section id="s2" class="screen card" hidden>
      <h2 data-i18n="whoTitle"></h2>
      <div class="chips" id="groupChips">
        <button class="chip on" data-g="family" data-i18n="family"></button>
        <button class="chip" data-g="friends" data-i18n="friends"></button>
        <button class="chip" data-g="students" data-i18n="students"></button>
        <button class="chip" data-g="couple" data-i18n="couple"></button>
        <button class="chip" data-g="solo" data-i18n="solo"></button>
      </div>

      <label data-i18n="numPeople"></label>
      <div class="stepper">
        <button id="minus" aria-label="-">−</button>
        <b id="pplVal">4</b>
        <button id="plus" aria-label="+">+</button>
      </div>

      <label class="check"><input type="checkbox" id="elders"> <span data-i18n="hasElders"></span></label>
      <label class="check"><input type="checkbox" id="kids"> <span data-i18n="hasKids"></span></label>

      <label><span data-i18n="startAt"></span>: <b id="startVal">9:00 AM</b></label>
      <input type="range" id="startH" min="6" max="17" value="9">

      <label><span data-i18n="hoursLbl"></span>: <b id="hoursVal">6</b></label>
      <input type="range" id="hours" min="3" max="12" value="6">

      <label><span data-i18n="budgetLbl"></span>: ₹<b id="budgetVal">1500</b></label>
      <input type="range" id="budget" min="200" max="10000" step="100" value="1500">

      <!-- AI is switched off (hidden and unticked) -->
      <input type="checkbox" id="useAI" hidden>

      <div class="row2">
        <button id="back2" class="btn ghost" data-i18n="back"></button>
        <button id="next2" class="btn" data-i18n="nextPlaces"></button>
      </div>
    </section>

    <!-- Step 3: places + food -->
    <section id="s3" class="screen card" hidden>
      <h2 data-i18n="nearTitle"></h2>
      <p class="sub" data-i18n="nearSub"></p>
      <div class="row2">
        <button id="allBtn" class="btn ghost small" data-i18n="all"></button>
        <button id="noneBtn" class="btn ghost small" data-i18n="none"></button>
      </div>
      <div id="placeList"></div>
      <p id="pickStatus" class="status"></p>

      <h2 class="mt">🍽 <span data-i18n="food"></span></h2>
      <label class="check"><input type="checkbox" id="vegOnly"> <span data-i18n="vegOnly"></span></label>
      <label data-i18n="lunchLbl"></label>
      <select id="lunchSel"></select>
      <label class="check"><input type="checkbox" id="addDinner"> <span data-i18n="addDinner"></span></label>
      <div id="dinnerBox" hidden>
        <label data-i18n="dinnerLbl"></label>
        <select id="dinnerSel"></select>
      </div>

      <div class="row2">
        <button id="back3" class="btn ghost" data-i18n="back"></button>
        <button id="planBtn" class="btn" data-i18n="makePlan"></button>
      </div>
    </section>

    <section id="result"></section>
  </main>

  <script src="i18n.js?v=4"></script>
  <script src="places.js?v=4"></script>
  <script src="planner.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
